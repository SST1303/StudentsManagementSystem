<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="ISO-8859-1">
    <title>Home - Student Management System</title>
    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
		<div class="container">
             <a class="navbar-brand fw-bold" href="#">🎓 Student Management System</a>
             <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                  <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/students}">Student Management</a></li>
            </ul>
            
			<div class="d-flex align-items-center">
				<div id="avatarBadge" class="avatar">US</div>                 
                 <span id="userProfileName" class="d-none" th:text="${#authentication.name}"></span>
               
				 <a class="btn btn-outline-light ms-3" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
				 
				 </div>
			</div> 
        </div>
    </nav>
        
   
	<section class="hero">
	    <div class="container">
            <h1 class="display-4 fw-bold">Welcome to Student Management System</h1>
			<p class="lead mt-3"> Manage student records quickly, securely and efficiently.</p>
            <a class="btn btn-primary btn-lg mt-4" th:href="@{/students}"><i class="bi bi-people-fill"></i> View Student List</a>
        </div>
	</section>
  
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/home.js}"></script>
</body>
</html>
