<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Reset Password - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/reset_password.css}">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow">
		<div class="container">
             <a class="navbar-brand fw-bold" href="#">🎓 Student Management System</a>
		</div>
    </nav>

    <div class="reset-wrapper">
        <div class="reset-card">
            <div class="text-center mb-4">
				<div class="logo">
                     <i class="bi bi-shield-lock-fill"></i>
				</div>
				
				<h3>Reset Password</h3>
				
				<p class="text-muted">Create your new password</p>
            </div>
                
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form id="resetForm" th:action="@{/forgot_password/reset}" method="post">
                    
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
						<input type="password" id="password" name="password" class="form-control" minlength="6" required>
                    </div>	                                           
						                       
					<div class="mb-3">

					                <label class="form-label">
					                    Confirm Password
					                </label>

					                <input type="password"
					                       id="confirmPassword"
					                       class="form-control"
					                       required>

					                <small id="passwordError"
					                       class="text-danger d-none">
					                    Passwords do not match.
					                </small>

					            </div>

					            <button class="btn btn-primary w-100">
					                Update Password
					            </button>

					        </form>

					    </div>

					</div>

					<script th:src="@{/js/reset_password.js}"></script>

					</body>
					</html>
