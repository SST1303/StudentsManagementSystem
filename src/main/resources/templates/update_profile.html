<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System - Update Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/update_profile.css}">
</head>
<body>

	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
	     <div class="container-fluid">
	         <a class="navbar-brand" href="#">🎓 Student Management System</a>
	         <div class="navbar-nav ms-auto">
	             <a class="btn btn-outline-light btn-sm" th:href="@{/students}">
	                 <i class="bi bi-arrow-left"></i> Back to Dashboard
	             </a>
	         </div>
	     </div>
    </nav>

<div class="container profile-container">
	<div class="card shadow-sm mb-5">
		<div class="card-header bg-warning text-dark text-center py-3">
			<h3 class="mb-0"><i class="bi bi-person-gear me-2"></i>Add / Update More Info</h3>
		</div>
		<div class="card-body p-4">
			
			<form th:action="@{/students/update/profile}" th:object="${student}" method="post" id="profileForm">
				
				<input type="hidden" th:field="*{id}">
				
				<div class="mb-3">
					<label class="form-label text-muted fw-bold">Full Name</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-person"></i></span>
						<input type="text" 
							   th:value="${student.firstName} + ' ' + (student.middleName != null ? student.middleName + ' ' : '') + ${student.lastName}" 
							   class="form-control bg-light" 
							   readonly>
					</div>
				</div>
				
				<div class="mb-3">
					<label class="form-label text-muted fw-bold">Email Address</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-envelope"></i></span>
						<input type="email" th:field="*{email}" class="form-control bg-light" readonly>
					</div>
				</div>
				
				<hr class="my-4">
				
				<div class="mb-3">
					<label for="mobileNumber" class="form-label fw-bold">Mobile Number</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-telephone"></i></span>
						<input type="text" id="mobileNumber" th:field="*{mobileNumber}" class="form-control" placeholder="Enter 10-digit mobile number" maxlength="10">
					</div>
				</div>
				
				<div class="mb-3">
				    <label for="dateOfBirth" class="form-label fw-bold">Date of Birth</label>
				    <div class="input-group">
				        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
				        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" placeholder="DD-MM-YYYY">
				    </div>
				</div>
				
				<div class="mb-3">
					<label for="address" class="form-label fw-bold">Residential Address</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
						<textarea id="address" th:field="*{address}" class="form-control" rows="3" placeholder="Enter your full address"></textarea>
					</div>
				</div>
				
				<div class="row mt-4">
					<div class="col-6">
						<a th:href="@{/students}" class="btn btn-secondary w-100">Cancel</a>
					</div>
					<div class="col-6">
						<button type="submit" class="btn btn-success w-100">Save Information</button>
					</div>
				</div>
			</form>
						
		</div>
	</div>
</div>

 <script th:src="@{/js/update_profile.js}" defer></script>

</body>
</html>
