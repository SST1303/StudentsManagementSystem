<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
	
	
	<nav class="navbar navbar-dark bg-dark shadow">
		<div class="container">
	         <a class="navbar-brand fw-bold" href="#">🎓 Student Management System</a>
		 </div>
    </nav>
		
		
		
<div class="login-wrapper">
	<div class="login-card">
		<div class="text-center mb-4">
		            <div class="logo">🎓</div>
		            <h2>Welcome Back</h2>
		            <p class="text-muted">Sign in to continue</p>
		        </div>

		        <div th:if="${param.error}" class="alert alert-danger">
		            Invalid Email or Password
		        </div>

		        <div th:if="${param.success}" class="alert alert-success">
		            Registration Successful! Please Login.
		        </div>

		        <form th:action="@{/login}" method="post">

		            <div class="mb-3">
		                <label>Email Address</label>
		                <input
		                    type="email"
		                    name="username"
		                    class="form-control"
		                    placeholder="Enter Email"
		                    required>
		            </div>

		            <div class="mb-4">
		                <label>Password</label>
		                <input
		                    type="password"
		                    name="password"
		                    class="form-control"
		                    placeholder="Enter Password"
		                    required>
		            </div>

		            <button class="btn btn-success w-100">
		                Login
		            </button>

		        </form>

		        <div class="text-center mt-3">
		            <a th:href="@{/forgot_password}">
		                Forgot Password?
		            </a>
		        </div>

		        <hr>

		        <div class="text-center">
		            New User?
		            <a th:href="@{/register}">
		                Register Here
		            </a>
		        </div>

		    </div>

		</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
        const isError = /*[[${param.error != null}]]*/ false;
        const isLogout = /*[[${param.logout != null}]]*/ false;
        const isRegSuccess = /*[[${param.success != null}]]*/ false;
        const isResetSuccess = /*[[${param.resetSuccess != null}]]*/ false;
 </script>

 <script th:src="@{/js/login.js}"></script>
 
</body>
</html>
