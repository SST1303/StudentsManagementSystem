<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Update Student</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
	
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		    <!-- Brand -->
		    <a class="navbar-brand" href="#">🎓 Student Management System</a>

			<div class="collapse navbar-collapse">
			        <ul class="navbar-nav">
			            <li class="nav-item">
			                <a class="nav-link" th:href="@{/students}">Student Management</a>
			            </li>
			        </ul>
			    </div>
		</nav>
	
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-lg-7">
				<div class="card shadow">
					<div class="card-header text-center">
						<h2>Update Student</h2>
					</div>
					
					<div class="card-body">
						<form th:action="@{/students/edit/{id}(id=${student.id})}" th:object="${student}" method="post">
							
							       <div class="form-group">
										<label>Student First Name</label>
										<input type="text" name="firstName" class ="form-control" th:field="*{firstName}" placeholder="Enter First Name"/>
									</div>
									
									<div class="form-group">
										<label>Student Middle Name</label>
										<input type="text" name="middleName" class ="form-control" th:field="*{middleName}" placeholder="Enter Middle Name"/>
									</div>
									
									<div class="form-group">
										<label>Student Last Name</label>					
										<input type="text" name="lastName" class ="form-control" th:field="*{lastName}" placeholder="Enter Last Name"/>
									</div>
									
									<div class="form-group">
										<label>Student Email</label>
										<input type="text" name="email" class ="form-control" th:field="*{email}" placeholder="Enter Email"/>
									</div>		
									
									<div class="form-group">
									    <label>Mobile Number</label>
									    <input type="text"
									           class="form-control"
									           th:field="*{mobileNumber}"
									           placeholder="Enter Mobile Number">
									</div>
									
									<div class="form-group">
									    <label>Date of Birth</label>
									    <input type="date"
									           class="form-control"
									           th:field="*{dateOfBirth}">
									</div>
									
									<div class="form-group">
									    <label>Address</label>
									    <textarea class="form-control"
									              rows="3"
									              th:field="*{address}"
									              placeholder="Enter Address"></textarea>
									</div>
																										
								
									<div class="box-footer">
										
										<button type="submit" class="btn btn-primary btn-block">
										    Update Student
										</button>
										
									</div>									
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

   
</body>
</html>
