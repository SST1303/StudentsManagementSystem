<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forgot_password.css}">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow">
		<div class="container">
             <a class="navbar-brand fw-bold" href="#">🎓 Student Management System</a>
		</div>
    </nav>
	
	<div class="forgot-wrapper">
		<div class="forgot-card">
			<div class="text-center mb-4">
			     <div class="logo">🔑</div>
				      <h3>Forgot Password</h3>
				     <p class="text-muted">Enter your registered email address to receive a password reset link.</p>
			</div>
				
			<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
								
			<form th:action="@{/forgot_password}" method="post">
				<div class="mb-4">
					<label>Email Address</label>
						<input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
					</div>
					<button type="submit" class="btn btn-warning w-100">Send Reset Link</button>
				</form>
				
				<div class="text-center mt-4">
					<a th:href="@{/login}"> ← Back to Login</a>
			    </div>
		</div>
    </div>
	
	<script th:src="@{/js/forgot_password.js}"></script>
	
</body>
</html>
