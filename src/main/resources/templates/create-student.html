<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Create Student</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/create-student.css}">
</head>
<body>
	
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		    <!-- Brand -->
		    <a class="navbar-brand" href="#">🎓 Student Management System</a>

		    <!-- Toggler/collapsible Button -->
		    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
		        <span class="navbar-toggler-icon"></span>
		    </button>

		    <!-- Navbar links -->
		    <div class="collapse navbar-collapse" id="collapsibleNavbar">
		        <ul class="navbar-nav">
		            <li class="nav-item"><a class="nav-link" th:href="@{/students}">Student Management</a></li>
		        </ul>
		    </div>
		</nav>
	
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-lg-6 col-md-8">
				<div class="card shadow">
					<div class="card-header text-center">
						<h2>Create New Student</h2>
					</div>
					
					<div class="card-body">
						<form th:action="@{/students}" th:object="${student}" method="post">
							
							<div class="form-group">
										<label>Student First Name</label>
										<input type="text" th:field="*{firstName}" class ="form-control" placeholder="Enter First Name"/>
										<small class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></small>
									</div>
									
									<div class="form-group">
										<label>Student Last Name</label>					
										<input type="text" th:field="*{lastName}" class ="form-control" placeholder="Enter Last Name"/>
										<small class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></small>
									</div>
											
									<div class="form-group">
										<label>Student Email</label>
										<input type="email" th:field="*{email}" class ="form-control" placeholder="Enter Email"/>
										<small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
									</div>								
								
									<div class="box-footer">
										
										<button type="submit" class="btn btn-primary">Submit</button>
										
									</div>								
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

   <script th:src="@{/js/create-student.js}"></script>
</body>
</html>
