<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8">
    <title>Student Management System - Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
	
	<nav class="navbar navbar-dark bg-dark shadow">
		<div class="container">
	        <a class="navbar-brand" href="#">🎓 Student Management System</a>
		</div>
	</nav>
	
	<div class="register-wrapper">
		<div class="register-card">
			<div class="text-center mb-4">
				<div class="logo">
					<i class="bi bi-person-plus-fill"></i>
				</div>
				
				<h3>Create Account</h3>
				
				<p class="text-muted">Register to access the Student Management System.</p>
			
			</div>
			
			<div th:if="${param.success}" class="alert alert-success">
			    Registration successful!
			    <a th:href="@{/login}">Login Here</a>
			</div>
				
			<div th:if="${error}" class="alert alert-danger" th:text="${error}">
				Email already registered!
			</div>
				
			<form th:action="@{/register/save}" th:object="${user}" method="post" id="registerForm">
					
				<div class="mb-3">
					<label class="form-label">Full Name</label>
					<input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter full name" required>
				</div>
					
				<div class="mb-3">
					<label class="form-label">Email Address</label>
					<input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter email address" required>
				</div>
					
				<div class="mb-4">
					<label class="form-label">Password</label>
					<input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Create password" required>
				</div>
					
				<button type="submit" class="btn btn-success w-100">Register Now</button>
			</form>
				
			<div class="text-center mt-4">
				Already have an account? 
				<a th:href="@{/login}">Login here</a>
			</div>
			
		</div>
	</div>
	
	<script th:src="@{/js/register.js}"></script>
	</body>
</html>
